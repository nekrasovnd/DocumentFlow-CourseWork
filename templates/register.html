{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">Регистрация</h3>
                <p class="text-muted text-center">При регистрации автоматически генерируются ключевая пара RSA-2048 и сертификат X.509</p>
                <form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Логин</label>
                        <input type="text" class="form-control" id="username" name="username" maxlength="64" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Пароль</label>
                        <input type="password" class="form-control" id="password" name="password" minlength="8" maxlength="128" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Зарегистрироваться</button>
                </form>
                <hr>
                <p class="text-center">
                    Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
